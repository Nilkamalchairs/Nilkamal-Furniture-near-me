>

  </div>  <!-- CATEGORY -->  <div class="category-bar" id="categoryBar"><button

>

</button>

  </div>  <!-- PRODUCTS -->  <main class="products-container"><div
  id="loading"

>
  Loading products...
</div>

<div
  id="productsGrid"
  class="products-grid"
></div>

<div
  id="noResults"

>
  <h3>No products found</h3>

  </main>  <script>

    const WHATSAPP_NUMBER = "918268321227";

    let products = [];
    let selectedCategory = "All";


    /*
      LOAD PRODUCTS FROM product.json
    */

    async function loadProducts() {

      try {

        const response = await fetch("product.json");

        if (!response.ok) {
          throw new Error("product.json could not be loaded");
        }

        const data = await response.json();

        products = data.products || [];

        document.getElementById("loading").style.display = "none";

        createCategories();

        displayProducts();

      } catch (error) {

        console.error(error);

        document.getElementById("loading").innerHTML =
          "Unable to load products. Please check product.json";

      }

    }


    /*
      CREATE CATEGORY BUTTONS
    */

    function createCategories() {

      const categoryBar =
        document.getElementById("categoryBar");

      const categories = [
        ...new Set(
          products
            .map(product => product.category)
            .filter(Boolean)
        )
      ];

      categories.forEach(category => {

        const button =
          document.createElement("button");

        button.className = "category-btn";

        button.textContent = category;

        button.dataset.category = category;

        button.addEventListener(
          "click",
          function() {

            selectedCategory = category;

            document
              .querySelectorAll(".category-btn")
              .forEach(btn =>
                btn.classList.remove("active")
              );

            button.classList.add("active");

            displayProducts();

          }
        );

        categoryBar.appendChild(button);

      });

      /*
        ALL BUTTON
      */

      const allButton =
        document.querySelector(
          '[data-category="All"]'
        );

      allButton.addEventListener(
        "click",
        function() {

          selectedCategory = "All";

          document
            .querySelectorAll(".category-btn")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          allButton.classList.add("active");

          displayProducts();

        }
      );

    }


    /*
      SEARCH
    */

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        displayProducts
      );


    /*
      SEARCH ALL IMPORTANT JSON FIELDS
    */

    function searchProduct(product, searchText) {

      if (!searchText) {
        return true;
      }

      const text = searchText.toLowerCase();

      const searchableText = [

        product.title,

        product.brand,

        product.category,

        product.description,

        product.dimensions,

        product.productDetails?.material,

        product.productDetails?.model,

        product.productDetails?.color,

        product.productDetails?.warranty

      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();

      return searchableText.includes(text);

    }


    /*
      DISPLAY PRODUCTS
    */

    function displayProducts() {

      const grid =
        document.getElementById("productsGrid");

      const noResults =
        document.getElementById("noResults");

      const searchText =
        document
          .getElementById("searchInput")
          .value
          .trim();

      grid.innerHTML = "";

      const filteredProducts =
        products.filter(product => {

          const categoryMatch =
            selectedCategory === "All" ||
            product.category === selectedCategory;

          const searchMatch =
            searchProduct(
              product,
              searchText
            );

          return categoryMatch && searchMatch;

        });


      if (filteredProducts.length === 0) {

        noResults.style.display = "block";

        return;

      }

      noResults.style.display = "none";


      filteredProducts.forEach(product => {

        grid.appendChild(
          createProductCard(product)
        );

      });

    }


    /*
      CREATE PRODUCT CARD
    */

    function createProductCard(product) {

      const card =
        document.createElement("article");

      card.className = "product-card";


      /*
        ONLY FIRST IMAGE
      */

      const image =
        product.images?.[0] || "";


      /*
        DESCRIPTION
        Remove HTML tags because card only
        needs short plain text.
      */

      const tempDiv =
        document.createElement("div");

      tempDiv.innerHTML =
        product.description || "";

      const description =
        tempDiv.textContent.trim();


      /*
        REVIEW DATA
      */

      const rating =
        product.review?.reviewStars;

      const reviewCount =
        product.review?.reviewCount || 0;


      let ratingHTML = "";

      if (rating) {

        const roundedRating =
          Math.round(rating);

        const stars =
          "★".repeat(roundedRating) +
          "☆".repeat(5 - roundedRating);

        ratingHTML = `
          <div class="rating">
            <span class="stars">${stars}</span>
            <span>${rating}</span>
            <span class="review-count">
              (${reviewCount})
            </span>
          </div>
        `;

      } else {

        ratingHTML = `
          <div class="rating">
            <span class="stars">★★★★★</span>
            <span class="review-count">
              (${reviewCount} reviews)
            </span>
          </div>
        `;

      }


      card.innerHTML = `

        <img
          class="product-image"
          src="${image}"
          alt="${escapeHTML(product.title)}"
          loading="lazy"
          onerror="this.style.display='none'"
        >

        <div class="product-content">

          <div class="brand">
            ${escapeHTML(product.brand || "")}
          </div>

          <h2 class="product-title">
            ${escapeHTML(product.title || "")}
          </h2>

          <div class="description">
            ${escapeHTML(description)}
          </div>

          ${ratingHTML}

          <label class="qty-label">
            Quantity
          </label>

          <input
            type="number"
            class="qty-input"
            min="1"
            value="1"
            inputmode="numeric"
          >

          <button
            class="whatsapp-btn"
            type="button"
          >
            Send Enquiry on WhatsApp
          </button>

        </div>

      `;


      /*
        WHATSAPP BUTTON
      */

      const button =
        card.querySelector(".whatsapp-btn");

      const qtyInput =
        card.querySelector(".qty-input");


      button.addEventListener(
        "click",
        function() {

          sendWhatsAppEnquiry(
            product,
            qtyInput.value
          );

        }
      );


      return card;

    }


    /*
      SEND WHATSAPP ENQUIRY
    */

    function sendWhatsAppEnquiry(
      product,
      quantity
    ) {

      quantity =
        parseInt(quantity);


      if (
        !quantity ||
        quantity < 1
      ) {

        alert(
          "Please enter a valid quantity."
        );

        return;

      }


      const image =
        product.images?.[0] || "";


      const message =

`Hello SHREE SHIVSHAKTI ENTERPRISES,

I want to enquire about this product.

Product: ${product.title}
Brand: ${product.brand || "N/A"}
Quantity: ${quantity}

Product Image:
${image}

Please share the latest price and availability.`;


      const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


      window.open(
        whatsappURL,
        "_blank"
      );

    }


    /*
      SECURITY / HTML ESCAPE
    */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /*
      START
    */

    loadProducts();

  </script></body>

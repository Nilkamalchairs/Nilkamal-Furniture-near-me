    /* =========================

    /* =========================

    /* =========================

    /* =========================

    /* =========================

  </style></head><body>  <!-- =========================
       HEADER
  ========================= -->  <header><div class="header-inner">

  <div class="store-name">
    SHREE SHIVSHAKTI ENTERPRISES
  </div>

  <div class="store-location">
    Nilkamal Furniture Store in Thane
  </div>

</div>

  </header>  <!-- =========================
       SEARCH
  ========================= -->  <div class="search-area"><input
  type="search"
  id="searchInput"
  placeholder="Search chair, cabinet, Nilkamal..."
  autocomplete="off"
  aria-label="Search products"
>

  </div>  <!-- =========================
       CATEGORY
  ========================= -->  <div
    class="category-bar"
    id="categoryBar"
  ><button
  class="category-btn active"
  data-category="All"
  type="button"
>
  All
</button>

  </div>  <!-- =========================
       PRODUCTS
  ========================= -->  <main class="products-container"><div
  id="loading"
  class="loading"
>
  Loading products...
</div>


<div
  id="productsGrid"
  class="products-grid"
></div>


<div
  id="noResults"
  class="no-results"
>

  <h3>
    No products found
  </h3>

  <p>
    Try another search or category.
  </p>

</div>


<div
  id="error"
  class="error"
  style="display:none;"
>

  <h3>
    Unable to load products
  </h3>

  <p>
    Please check that
    <strong>product.json</strong>
    exists in the same folder.
  </p>

</div>

  </main>  <script>

    /*
      =========================
      SETTINGS
      =========================
    */

    const WHATSAPP_NUMBER =
      "918268321227";


    /*
      =========================
      GLOBAL DATA
      =========================
    */

    let products = [];

    let selectedCategory = "All";


    /*
      =========================
      LOAD PRODUCT.JSON
      =========================
    */

    async function loadProducts() {

      try {

        const response =
          await fetch(
            "product.json",
            {
              cache: "no-cache"
            }
          );


        if (!response.ok) {

          throw new Error(
            "product.json could not be loaded"
          );

        }


        const data =
          await response.json();


        products =
          Array.isArray(data.products)
            ? data.products
            : [];


        document
          .getElementById("loading")
          .style.display = "none";


        if (products.length === 0) {

          showNoProducts();

          return;

        }


        createCategories();

        displayProducts();


      } catch (error) {

        console.error(
          "Product JSON Error:",
          error
        );


        document
          .getElementById("loading")
          .style.display = "none";


        document
          .getElementById("error")
          .style.display = "block";

      }

    }


    /*
      =========================
      CREATE CATEGORIES
      =========================
    */

    function createCategories() {

      const categoryBar =
        document.getElementById(
          "categoryBar"
        );


      const categories = [
        ...new Set(
          products
            .map(
              product =>
                product.category
            )
            .filter(Boolean)
        )
      ];


      categories.forEach(
        category => {

          const button =
            document.createElement(
              "button"
            );


          button.type = "button";

          button.className =
            "category-btn";

          button.textContent =
            category;

          button.dataset.category =
            category;


          button.addEventListener(
            "click",
            function() {

              selectedCategory =
                category;


              document
                .querySelectorAll(
                  ".category-btn"
                )
                .forEach(
                  btn =>
                    btn.classList
                      .remove("active")
                );


              button.classList
                .add("active");


              displayProducts();

            }
          );


          categoryBar.appendChild(
            button
          );

        }
      );


      /*
        ALL CATEGORY
      */

      const allButton =
        document.querySelector(
          '[data-category="All"]'
        );


      allButton.addEventListener(
        "click",
        function() {

          selectedCategory =
            "All";


          document
            .querySelectorAll(
              ".category-btn"
            )
            .forEach(
              btn =>
                btn.classList
                  .remove("active")
            );


          allButton.classList
            .add("active");


          displayProducts();

        }
      );

    }


    /*
      =========================
      SEARCH
      =========================
    */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        displayProducts
      );


    /*
      =========================
      SEARCH JSON DATA
      =========================

      Search works in:

      Title
      Brand
      Category
      Description
      Dimensions
      Material
      Model
      Color
      Warranty
    */

    function searchProduct(
      product,
      searchText
    ) {

      if (!searchText) {

        return true;

      }


      const text =
        searchText.toLowerCase();


      const searchableText = [

        product.title,

        product.brand,

        product.category,

        product.description,

        product.dimensions,

        product.productDetails?.material,

        product.productDetails?.model,

        product.productDetails?.color,

        product.productDetails?.warranty

      ]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();


      return searchableText
        .includes(text);

    }


    /*
      =========================
      DISPLAY PRODUCTS
      =========================
    */

    function displayProducts() {

      const grid =
        document.getElementById(
          "productsGrid"
        );


      const noResults =
        document.getElementById(
          "noResults"
        );


      const searchText =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim();


      grid.innerHTML = "";


      const filteredProducts =
        products.filter(
          product => {

            const categoryMatch =
              selectedCategory === "All" ||
              product.category ===
                selectedCategory;


            const searchMatch =
              searchProduct(
                product,
                searchText
              );


            return (
              categoryMatch &&
              searchMatch
            );

          }
        );


      /*
        NO RESULTS
      */

      if (
        filteredProducts.length === 0
      ) {

        noResults.style.display =
          "block";

        return;

      }


      noResults.style.display =
        "none";


      /*
        CREATE CARDS
      */

      filteredProducts.forEach(
        product => {

          grid.appendChild(
            createProductCard(
              product
            )
          );

        }
      );

    }


    /*
      =========================
      PRODUCT CARD
      =========================
    */

    function createProductCard(
      product
    ) {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "product-card";


      /*
        FIRST IMAGE ONLY
      */

      const image =
        product.images?.[0] || "";


      /*
        REMOVE HTML FROM
        DESCRIPTION
      */

      const tempDiv =
        document.createElement(
          "div"
        );


      tempDiv.innerHTML =
        product.description || "";


      const description =
        tempDiv.textContent
          .trim();


      /*
        RATING
      */

      const rating =
        product.review?.reviewStars;


      const reviewCount =
        product.review?.reviewCount ||
        0;


      let ratingHTML = "";


      if (rating) {

        const roundedRating =
          Math.max(
            0,
            Math.min(
              5,
              Math.round(rating)
            )
          );


        const stars =
          "★".repeat(
            roundedRating
          ) +
          "☆".repeat(
            5 - roundedRating
          );


        ratingHTML = `

          <div class="rating">

            <span class="stars">
              ${stars}
            </span>

            <span class="rating-number">
              ${rating}
            </span>

            <span class="review-count">
              (${reviewCount})
            </span>

          </div>

        `;

      } else {

        ratingHTML = `

          <div class="rating">

            <span class="stars">
              ★★★★★
            </span>

            <span class="review-count">
              (${reviewCount} reviews)
            </span>

          </div>

        `;

      }


      /*
        PRODUCT CARD HTML
      */

      card.innerHTML = `

        <img
          class="product-image"
          src="${escapeHTML(image)}"
          alt="${escapeHTML(
            product.title || "Product"
          )}"
          loading="lazy"
        >


        <div class="product-content">


          <div class="brand">
            ${escapeHTML(
              product.brand || ""
            )}
          </div>


          <h2 class="product-title">

            <a
              href="product-details.html?id=${encodeURIComponent(
                product.id
              )}"
            >
              ${escapeHTML(
                product.title || ""
              )}
            </a>

          </h2>


          <div class="description">

            ${escapeHTML(
              description
            )}

          </div>


          ${ratingHTML}


          <label class="qty-label">

            Quantity

          </label>


          <input
            type="number"
            class="qty-input"
            min="1"
            value="1"
            inputmode="numeric"
            aria-label="Quantity"
          >


          <button
            class="whatsapp-btn"
            type="button"
          >

            Send Enquiry on WhatsApp

          </button>


        </div>

      `;


      /*
        WHATSAPP BUTTON
      */

      const button =
        card.querySelector(
          ".whatsapp-btn"
        );


      const quantityInput =
        card.querySelector(
          ".qty-input"
        );


      button.addEventListener(
        "click",
        function() {

          sendWhatsAppEnquiry(
            product,
            quantityInput.value
          );

        }
      );


      /*
        IMAGE ERROR
      */

      const productImage =
        card.querySelector(
          ".product-image"
        );


      productImage.addEventListener(
        "error",
        function() {

          this.style.display =
            "none";

        }
      );


      return card;

    }


    /*
      =========================
      WHATSAPP ENQUIRY
      =========================
    */

    function sendWhatsAppEnquiry(
      product,
      quantity
    ) {

      quantity =
        parseInt(
          quantity
        );


      if (
        !quantity ||
        quantity < 1
      ) {

        alert(
          "Please enter a valid quantity."
        );

        return;

      }


      const image =
        product.images?.[0] || "";


      const message =

`Hello SHREE SHIVSHAKTI ENTERPRISES,

I want to enquire about this product.

Product: ${product.title}

Brand: ${product.brand || "N/A"}

Quantity: ${quantity}

Product Image:
${image}

Product Page:
${window.location.origin}/Nilkamal-Furniture-near-me/product-details.html?id=${encodeURIComponent(product.id)}

Please share the latest price and availability.`;


      const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(
          message
        );


      window.open(
        whatsappURL,
        "_blank"
      );

    }


    /*
      =========================
      NO PRODUCTS
      =========================
    */

    function showNoProducts() {

      document.getElementById(
        "noResults"
      ).style.display =
        "block";

    }


    /*
      =========================
      ESCAPE HTML
      =========================
    */

    function escapeHTML(
      text
    ) {

      return String(text)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
      =========================
      START
      =========================
    */

    loadProducts();

  </script></body></html>

"use strict";


const PRODUCT_FILE = "product.json";
const WHATSAPP_NUMBER = "918268321227";

const app = document.getElementById("app");

const params = new URLSearchParams(
  window.location.search
);

const productId = params.get("id");


/* -----------------------------
   HELPERS
----------------------------- */

function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getImage(product) {

  if (
    Array.isArray(product.images) &&
    product.images.length
  ) {
    return product.images;
  }

  if (product.image) {
    return [product.image];
  }

  return [];

}


function getPrice(product) {

  return Number(
    product.discountPrice ??
    product.salePrice ??
    product.price ??
    product.MRP ??
    0
  );

}


function getMRP(product) {

  return Number(
    product.MRP ??
    product.mrp ??
    0
  );

}


function getDiscount(product) {

  if (
    product.discountPercentage !== undefined
  ) {
    return Number(
      product.discountPercentage
    ) || 0;
  }

  const mrp = getMRP(product);
  const price = getPrice(product);

  if (mrp > price && price > 0) {

    return Math.round(
      ((mrp - price) / mrp) * 100
    );

  }

  return 0;

}


function formatPrice(value) {

  if (!value || value <= 0) {
    return "";
  }

  return "₹" +
    Math.round(value)
      .toLocaleString("en-IN");

}


function getReviewCount(product) {

  if (
    product.reviewCount !== undefined
  ) {
    return product.reviewCount;
  }

  if (
    product.review &&
    typeof product.review === "object"
  ) {
    return product.review.reviewCount || 0;
  }

  if (product.reviews !== undefined) {
    return product.reviews;
  }

  return 0;

}


function getStars(product) {

  let rating = null;

  if (product.rating !== undefined) {
    rating = Number(product.rating);
  }

  if (
    product.review &&
    typeof product.review === "object" &&
    product.review.reviewStars !== null &&
    product.review.reviewStars !== undefined
  ) {
    rating =
      Number(product.review.reviewStars);
  }

  if (!rating || rating < 1) {
    return "★★★★★";
  }

  const rounded =
    Math.max(
      1,
      Math.min(5, Math.round(rating))
    );

  return (
    "★".repeat(rounded) +
    "☆".repeat(5 - rounded)
  );

}


function getDescription(product) {

  const temp =
    document.createElement("div");

  temp.innerHTML =
    product.description || "";

  return (
    temp.innerHTML ||
    "Quality furniture for home, office and commercial use."
  );

}


function cleanText(value) {

  const temp =
    document.createElement("div");

  temp.innerHTML =
    value || "";

  return (
    temp.textContent ||
    temp.innerText ||
    ""
  ).trim();

}


/* -----------------------------
   PRODUCT DETAILS
----------------------------- */

function renderProduct(product, allProducts) {

  const images =
    getImage(product);

  const firstImage =
    images[0] || "";

  const details =
    product.productDetails &&
    typeof product.productDetails === "object"
      ? product.productDetails
      : {};

  const price =
    getPrice(product);

  const mrp =
    getMRP(product);

  const discount =
    getDiscount(product);

  const reviews =
    getReviewCount(product);

  const stars =
    getStars(product);


  document.title =
    `${product.title || "Nilkamal Furniture"} in Thane | SHREE SHIVSHAKTI ENTERPRISES`;


  const metaDescription =
    document.querySelector(
      'meta[name="description"]'
    );

  if (metaDescription) {

    metaDescription.content =
      `${product.title || "Nilkamal Furniture"} available from SHREE SHIVSHAKTI ENTERPRISES in Thane. Check price, warranty and product details.`;

  }


  const canonical =
    document.querySelector(
      'link[rel="canonical"]'
    );

  if (canonical) {

    canonical.href =
      window.location.href;

  }


  const hotBadge =
    product.hotSale === true
      ? `<span class="hot-badge">HOT</span>`
      : "";


  const thumbnails =
    images.length
      ? images.map((image, index) => `
          <button
            class="thumbnail ${index === 0 ? "active" : ""}"
            type="button"
            data-image="${escapeHTML(image)}"
            aria-label="View product image ${index + 1}">

            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(product.title || "Product")}"
              loading="${index === 0 ? "eager" : "lazy"}"
              decoding="async">

          </button>
        `).join("")
      : "";


  const priceHTML =
    price > 0
      ? `
        <div class="price-row">

          <span class="sale-price">
            ${formatPrice(price)}
          </span>

          ${
            mrp > price
              ? `<span class="mrp">${formatPrice(mrp)}</span>`
              : ""
          }

          ${
            discount > 0
              ? `<span class="discount">${discount}% OFF</span>`
              : ""
          }

        </div>

        <div class="price-note">
          Final price and availability can be confirmed on WhatsApp.
        </div>
      `
      : `
        <div class="price-row">
          <span class="sale-price">
            Get Price
          </span>
        </div>
      `;


  /*
    Details shown on the detail page.
    Colour is intentionally not shown.
  */

  const detailRows = [

    ["Brand", product.brand],

    ["Material", details.material],

    ["Model", details.model],

    ["Warranty", details.warranty],

    ["Load Capacity", details.loadCapacity],

    ["Capacity", details.capacity],

    ["Delivery", details.deliveryCondition],

    ["Assembly", details.assemblyType]

  ].filter(item =>
    item[1] !== undefined &&
    item[1] !== null &&
    String(item[1]).trim() !== ""
  );


  const detailsHTML =
    detailRows.length
      ? `
        <section class="details-card">

          <h2 class="section-title">
            Product Details
          </h2>

          <div class="details-grid">

            ${detailRows.map(item => `
              <div class="detail-item">

                <div class="detail-label">
                  ${escapeHTML(item[0])}
                </div>

                <div class="detail-value">
                  ${escapeHTML(item[1])}
                </div>

              </div>
            `).join("")}

          </div>

        </section>
      `
      : "";


  const related =
    allProducts
      .filter(item =>
        String(item.id) !==
        String(product.id)
      )
      .filter(item =>
        item.category === product.category
      )
      .slice(0, 4);


  const relatedHTML =
    related.length
      ? `
        <section class="related-section">

          <div class="related-header">

            <h2 class="section-title" style="margin:0;">
              You May Also Like
            </h2>

            <a
              class="view-all"
              href="products.html">
              View All
            </a>

          </div>


          <div class="related-grid">

            ${related.map(item => {

              const relatedImages =
                getImage(item);

              const relatedPrice =
                getPrice(item);

              return `
                <a
                  class="related-card"
                  href="product-details.html?id=${encodeURIComponent(item.id || "")}">

                  ${
                    relatedImages[0]
                      ? `
                        <img
                          class="related-image"
                          src="${escapeHTML(relatedImages[0])}"
                          alt="${escapeHTML(item.title || "Nilkamal Furniture")}"
                          loading="lazy"
                          decoding="async">
                      `
                      : `
                        <div
                          class="related-image"
                          style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:#999;
                            font-size:11px;
                          ">
                          Image unavailable
                        </div>
                      `
                  }

                  <div class="related-body">

                    <div class="related-brand">
                      ${escapeHTML(item.brand || "Nilkamal")}
                    </div>

                    <div class="related-title">
                      ${escapeHTML(item.title || "Furniture")}
                    </div>

                    ${
                      relatedPrice > 0
                        ? `
                          <div class="related-price">
                            ${formatPrice(relatedPrice)}
                          </div>
                        `
                        : ""
                    }

                  </div>

                </a>
              `;

            }).join("")}

          </div>

        </section>
      `
      : "";


  app.innerHTML = `

    <div class="product-layout">

      <!-- GALLERY -->

      <section class="gallery-card">

        <div class="main-image-wrap">

          ${
            firstImage
              ? `
                <img
                  id="mainImage"
                  class="main-image"
                  src="${escapeHTML(firstImage)}"
                  alt="${escapeHTML(product.title || "Nilkamal Furniture")}"
                  fetchpriority="high"
                  decoding="async">
              `
              : `
                <div
                  style="
                    width:100%;
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#999;
                    font-size:13px;
                  ">
                  Image unavailable
                </div>
              `
          }

          ${hotBadge}

        </div>


        ${
          thumbnails
            ? `
              <div class="thumbnail-row">
                ${thumbnails}
              </div>
            `
            : ""
        }

      </section>


      <!-- PRODUCT INFO -->

      <section class="info-card">

        <div class="brand">
          ${escapeHTML(product.brand || "Nilkamal")}
        </div>


        <h1 class="product-title">
          ${escapeHTML(product.title || "Nilkamal Furniture")}
        </h1>


        <div class="rating">

          <span class="stars">
            ${stars}
          </span>

          ${
            reviews
              ? `
                <span class="review-count">
                  ${escapeHTML(reviews)} reviews
                </span>
              `
              : ""
          }

        </div>


        <div class="price-box">

          ${priceHTML}

        </div>


        <div class="description">

          ${getDescription(product)}

        </div>


        <div class="trust-box">

          <div class="trust-item">

            <div class="trust-title">
              Genuine Product
            </div>

            <div class="trust-text">
              Nilkamal furniture
            </div>

          </div>


          <div class="trust-item">

            <div class="trust-title">
              Warranty
            </div>

            <div class="trust-text">
              As applicable to product
            </div>

          </div>


          <div class="trust-item">

            <div class="trust-title">
              Retail & Bulk
            </div>

            <div class="trust-text">
              Enquiries accepted
            </div>

          </div>


          <div class="trust-item">

            <div class="trust-title">
              Thane Store
            </div>

            <div class="trust-text">
              SHREE SHIVSHAKTI ENTERPRISES
            </div>

          </div>

        </div>


        <div class="purchase-box">

          <label
            class="quantity-label"
            for="quantity">
            Quantity
          </label>

          <input
            id="quantity"
            class="quantity-input"
            type="number"
            min="1"
            value="1"
            inputmode="numeric">


          <button
            id="whatsappBtn"
            class="whatsapp-btn"
            type="button">

            WhatsApp Enquiry

          </button>


          <a
            class="location-btn"
            href="https://maps.app.goo.gl/tiEruQ4SLro3ExLU67"
            target="_blank"
            rel="noopener">

            View Store on Google Maps

          </a>

        </div>

      </section>

    </div>


    ${detailsHTML}

    ${relatedHTML}

  `;


  /* IMAGE GALLERY */

  const mainImage =
    document.getElementById("mainImage");


  document
    .querySelectorAll(".thumbnail")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          if (!mainImage) return;

          mainImage.src =
            button.dataset.image;

          document
            .querySelectorAll(".thumbnail")
            .forEach(item =>
              item.classList.remove("active")
            );

          button.classList.add("active");

        }
      );

    });


  /* WHATSAPP */

  const whatsappBtn =
    document.getElementById("whatsappBtn");


  whatsappBtn?.addEventListener(
    "click",
    () => {

      const quantity =
        Math.max(
          1,
          Number(
            document.getElementById("quantity")
              ?.value || 1
          )
        );


      const productURL =
        window.location.href;


      const message =
`Hello SHREE SHIVSHAKTI ENTERPRISES,

I am interested in this product:

Product: ${product.title || "Furniture"}
Quantity: ${quantity}
${price > 0 ? `Price: ${formatPrice(price)}` : ""}

Product Details:
${productURL}

Please share availability and final price.`;


      const url =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


      window.open(
        url,
        "_blank",
        "noopener"
      );

    }
  );


  /* PRODUCT SCHEMA */

  const existingSchema =
    document.getElementById(
      "productSchema"
    );

  existingSchema?.remove();


  const schema = {

    "@context": "https://schema.org",

    "@type": "Product",

    "name":
      product.title || "Nilkamal Furniture",

    "description":
      cleanText(
        product.description ||
        "Nilkamal furniture product"
      ),

    "image":
      images,

    "sku":
      String(product.id || ""),

    "brand": {
      "@type": "Brand",
      "name":
        product.brand || "Nilkamal"
    },

    "category":
      product.category || "Furniture",

    "url":
      window.location.href

  };


  if (price > 0) {

    schema.offers = {

      "@type": "Offer",

      "priceCurrency": "INR",

      "price":
        String(price),

      "availability":
        "https://schema.org/InStock",

      "url":
        window.location.href

    };

  }


  if (reviews > 0) {

    schema.aggregateRating = {

      "@type": "AggregateRating",

      "ratingValue":
        Number(
          product.rating ||
          product.review?.reviewStars ||
          5
        ),

      "reviewCount":
        Number(reviews)

    };

  }


  const script =
    document.createElement("script");

  script.id =
    "productSchema";

  script.type =
    "application/ld+json";

  script.textContent =
    JSON.stringify(schema);


  document.head.appendChild(script);

}


/* -----------------------------
   LOAD
----------------------------- */

async function loadProduct() {

  if (!productId) {

    app.innerHTML = `

      <div class="state-card">

        <div class="state-title">
          Product Not Found
        </div>

        <div class="state-text">
          Please select a product from the catalogue.
        </div>

        <a
          class="state-btn"
          href="products.html">
          View All Products
        </a>

      </div>

    `;

    return;
  }


  try {

    const response =
      await fetch(
        PRODUCT_FILE + "?v=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {
      throw new Error(
        "Unable to load product.json"
      );
    }


    const data =
      await response.json();


    const products =
      Array.isArray(data)
        ? data
        : Array.isArray(data.products)
          ? data.products
          : [];


    const product =
      products.find(
        item =>
          String(item.id) ===
          String(productId)
      );


    if (!product) {

      app.innerHTML = `

        <div class="state-card">

          <div class="state-title">
            Product Not Found
          </div>

          <div class="state-text">
            This product may have been removed or updated.
          </div>

          <a
            class="state-btn"
            href="products.html">
            View All Products
          </a>

        </div>

      `;

      return;
    }


    renderProduct(
      product,
      products
    );


  } catch (error) {

    console.error(error);


    app.innerHTML = `

      <div class="state-card">

        <div class="state-title">
          Catalogue Temporarily Unavailable
        </div>

        <div class="state-text">
          Please refresh the page and try again.
        </div>

        <a
          class="state-btn"
          href="products.html">
          Back to Products
        </a>

      </div>

    `;

  }

}


loadProduct();

</script></body>
